<!DOCTYPE html>

<head>

<title>청담 모바일 시안</title>
<style>
  body{margin:0;background:#e8e9ec;font-family:Pretendard,-apple-system,sans-serif;

  .wrap{width:100%;max-width:440px}
  h1{font-size:20px;font-weight:800;margin:0 0 16px;color:#1a1a1a}
  a.card{display:flex;align-items:center;gap:14px;padding:18px;margin-bottom:12px;

         box-shadow:0 1px 3px rgba(0,0,0,.08)}
  a.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .badge{width:44px;height:44px;border-radius:10px;flex:0 0 auto;display:flex;
         align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
  .t{font-weight:700;font-size:15px}
  .d{font-size:13px;color:#6b7280;margin-top:2px}

<body>
<div class="wrap">
  <h1>청담 모바일 시안</h1>
  <a class="card" href="./cheongdam-2a.html">

    <span><span class="t">주황 시안</span><span class="d">기본 레이아웃</span></span>
  </a>
  <a class="card" href="./cheongdam-3b.html">
    <span class="badge" style="background:#2B6BF3">3b</span>
    <span><span class="t">블루 시안</span><span class="d">1열 대형카드 레이아웃</span></span>
